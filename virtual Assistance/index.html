<!DOCTYPE html>
<html lang="english" class="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shifra, My Virtual Assistance</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="logo.jpg" type="image/x-icon">
    <!-- Add Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="theme-toggle">
        <i class="fas fa-moon" id="theme-icon"></i>
    </div>
    
    <img src="logos.jpg" alt="logos" id="logo">
    <h1>I'm <span id="name">Shifra</span>, Your <span id="va">Virtual Assistant</span></h1>
    
    <!-- Image for voice animation -->
    <img src="SVKl.gif" alt="voice animation" id="voice" style="display:none;">
    
    <!-- Response container -->
    <div id="response-container">
        <p id="response-text"></p>
    </div>
    
    <!-- Button with microphone icon to start the interaction -->
    <button id="btn">
        <img src="mic.svg" alt="microphone icon">
        <span id="content">Click here to talk to me</span>
    </button>
    
    <!-- History button container - centered -->
    <div class="history-button-container">
        <button id="history-btn">
            <i class="fas fa-history"></i> History
        </button>
    </div>
    
    <!-- History modal -->
    <div id="history-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Conversation History</h2>
            <ul id="history-list"></ul>
        </div>
    </div>

    <!-- Link the JavaScript file at the end to avoid DOM issues -->
    <script src="script.js"></script>
</body>
</html>
